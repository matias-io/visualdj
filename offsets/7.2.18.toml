# rekordbox 7.2.18 (Windows). Each deck's player object carries these module pointers at
# fixed distances from its playback position field; Onset scans memory for the first one
# and confirms the rest, so nothing depends on where the allocator put the objects. Decks
# are numbered by address. Positions count samples of the loaded file, so position_rate_hz
# is 0 and the reader uses the track's own rate. No master-deck flag is known (the byte that
# looked like one is a counter), so the show follows the deck that is playing. Loaded
# tracks come from the audio files rekordbox keeps open, not from memory.
rekordbox_version = "7.2.18"
platform = "windows"
position_format = "i32"
position_rate_hz = 0.0
provenance = "onset-cli memfind + anchor probe, 2026-09-24"

[signature]
max_decks = 4
# offsets are decimal because TOML has no negative hex: -32 = -0x20, -80 = -0x50,
# -128 = -0x80, -176 = -0xb0, -904 = -0x388, 48 = 0x30.
anchors = [
    { offset = -32, module_offset = 0x10465af },
    { offset = -80, module_offset = 0xeee324 },
    { offset = -128, module_offset = 0x28cc16d },
    { offset = -176, module_offset = 0x28c73a4 },
    { offset = -904, module_offset = 0x2711d60 },
    { offset = 48, module_offset = 0x28c5edc },
]
